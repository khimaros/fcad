[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcad"
version = "0.1.0"
description = "reusable FreeCAD build + instrumentation for parametric, code-defined models"
readme = "README.md"
# FreeCAD 1.1 bundles python 3.11; the in-FreeCAD modules must parse there too.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# render/animate run under plain python (no FreeCAD); animate also needs ffmpeg.
render = ["numpy", "numpy-stl", "matplotlib"]

[project.scripts]
fcad = "fcad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fcad"]

# ship the gui rebuild macro as package data (install-macro reads it from here).
[tool.hatch.build.targets.wheel.force-include]
"src/fcad/resources" = "fcad/resources"
