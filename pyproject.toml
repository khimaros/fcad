[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcad"
version = "0.1.0"
description = "reusable FreeCAD build + instrumentation for parametric, code-defined models"
readme = "README.md"
# FreeCAD 1.1 bundles python 3.11; the in-FreeCAD modules must parse there too.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# render/animate run under plain python (no FreeCAD); animate also needs ffmpeg.
render = ["numpy", "numpy-stl", "matplotlib"]

[project.scripts]
fcad = "fcad.cli:main"

[tool.hatch.build.targets.wheel]
# hatchling ships every file under the package dir, so `resources/` (the rebuild
# macro, the drawing template, the agent skill that install-macro/install-skill
# read back) needs no force-include - adding one made the wheel build fail
# outright on a duplicate archive entry.
packages = ["src/fcad"]

# the README is the fcad skill's user documentation, so a wheel has to carry it
# where `install-skill` looks. it lives at the repo root (github wants it there)
# and is force-included rather than copied, so there is one of it. an editable
# install finds the real file instead -- see cli._project_readme.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "fcad/resources/skills/fcad/README.md"
